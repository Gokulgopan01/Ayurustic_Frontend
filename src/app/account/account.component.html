<div class="account-page">
    <div class="page-header">
        <h1>My Account</h1>
        <p class="subtitle">Your personal Ayurustic profile</p>
    </div>

    <div class="account-content">
        <div class="avatar-section">
            <div class="avatar">{{ user.name.charAt(0) }}</div>
            <h2>{{ user.name }}</h2>
            <p class="member-since">Member since {{ user.joined }}</p>
        </div>

        <div class="menu-section">
            <a routerLink="/wishlist" class="menu-item">
                <span class="menu-icon">♡</span>
                <span>My Wishlist</span>
                <span class="arrow">›</span>
            </a>
            <a routerLink="/cart" class="menu-item">
                <span class="menu-icon">🛒</span>
                <span>My Cart</span>
                <span class="arrow">›</span>
            </a>
            <a routerLink="/shop" class="menu-item">
                <span class="menu-icon">🛍️</span>
                <span>Shop</span>
                <span class="arrow">›</span>
            </a>
            <a routerLink="/discover" class="menu-item">
                <span class="menu-icon">🔍</span>
                <span>Discover</span>
                <span class="arrow">›</span>
            </a>
        </div>
    </div>

</div>
