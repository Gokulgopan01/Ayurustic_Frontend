<div class="discover-page">

  <div class="lang-selector-container">
    <div class="lang-popup" [class.open]="isLangMenuOpen">
      <div class="lang-popup-header">Select Language</div>
      <div class="lang-popup-list">
        <button *ngFor="let lang of languages" [class.active]="currentLang === lang.code" (click)="setLang(lang.code)">
          {{ lang.name }}
        </button>
      </div>
    </div>
    <button class="lang-toggle-btn" [class.rotated]="isLangMenuOpen" (click)="toggleLangMenu()">
      {{ currentLang }}
    </button>
  </div>

  <header class="page-header">
    <h1 class="main-title reveal" [innerHTML]="t.mainTitle"></h1>
  </header>

  <div class="sections-container">

    <section class="craft-section reveal delay-2 botanical-silk-section">
      <div class="section-image-wrapper">
        <img src="/assets/Discover_1_without_content.jpeg" alt="The Art of Botanical Silk" class="section-image"
          (error)="onImageError($event)">
        <div class="section-overlay">
          <h2 class="overlay-heading" [innerHTML]="t.s1h"></h2>
          <p class="overlay-description" [innerHTML]="t.s1b"></p>
        </div>
        <div class="fallback-placeholder" [innerHTML]="t.s1h"></div>
      </div>
    </section>

    <section class="craft-section reveal delay-2 botanical-silk-section">
      <div class="section-image-wrapper">
        <img src="/assets/Discover_2_without_content.jpeg" alt="100% Mulberry Silk" class="section-image"
          (error)="onImageError($event)">
        <div class="mulberry-overlay">
          <h2 class="mulberry-heading" [innerHTML]="t.s2h"></h2>
          <p class="mulberry-description" [innerHTML]="t.s2b"></p>
        </div>
        <div class="fallback-placeholder" [innerHTML]="t.s2h"></div>
      </div>
    </section>

    <section class="craft-section reveal delay-1 botanical-silk-section">
      <div class="section-image-wrapper">
        <img src="/assets/Discover_3_without_content.PNG" alt="Botanical Colour" class="section-image"
          (error)="onImageError($event)">
        <div class="botanical-colour-overlay">
          <h2 class="colour-overlay-heading" [innerHTML]="t.s3h"></h2>
          <p class="colour-overlay-description" [innerHTML]="t.s3b"></p>
        </div>
        <div class="fallback-placeholder" [innerHTML]="t.s3h"></div>
      </div>
    </section>

    <!-- Section 1 -->
    <section class="craft-section reveal botanical-silk-section">
      <div class="section-image-wrapper">
        <img src="/assets/Discover_4_without_content.jpeg" alt="Crafted with Intention" class="section-image"
          (error)="onImageError($event)">
        <div class="silk-overlay-description">
          <h2 class="intention-heading" [innerHTML]="t.s4h"></h2>
          <p class="intention-description" [innerHTML]="t.s4b"></p>
        </div>
        <div class="fallback-placeholder" [innerHTML]="t.s4h"></div>
      </div>
    </section>

  </div>

</div>
