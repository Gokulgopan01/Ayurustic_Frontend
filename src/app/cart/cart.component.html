<div class="cart-page">
    <div class="page-header">
        <h1>Shopping Cart</h1>
        <p class="subtitle">Review your Ayurvedic selections</p>
    </div>

    <div class="cart-container" *ngIf="cartItems.length > 0">
        <div class="cart-items-list">
            <div class="cart-item-card" *ngFor="let item of cartItems">
                <div class="item-main">
                    <div class="item-image">
                        <img [src]="item.image" [alt]="item.name">
                    </div>
                    <div class="item-details">
                        <div class="item-header">
                            <span class="category">{{item.category}}</span>
                            <button class="remove-btn" (click)="removeFromCart(item.id)">✕</button>
                        </div>
                        <h3>{{item.name}}</h3>
                        <div class="item-meta">
                            <span class="price">₹{{item.price}}</span>
                            <span class="quantity">Qty: {{item.quantity}}</span>
                        </div>
                        <button class="status-toggle-btn" (click)="toggleStatus(item)">
                            {{ item.showStatus ? 'Hide Status' : 'Show Status' }}
                            <span class="arrow" [class.up]="item.showStatus">▼</span>
                        </button>
                    </div>
                </div>

                <!-- Order Status Tracker -->
                <div class="status-tracker-rail" *ngIf="item.showStatus">
                    <div class="status-line">
                        <div class="status-progress"
                            [style.width]="(item.currentStatusIndex / (item.statuses.length - 1) * 100) + '%'"></div>
                    </div>
                    <div class="status-points">
                        <div class="status-point" *ngFor="let status of item.statuses; let i = index"
                            [class.active]="i <= item.currentStatusIndex"
                            [class.current]="i === item.currentStatusIndex">
                            <div class="dot"></div>
                            <span class="status-label">{{status}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="cart-summary">
            <div class="summary-card">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹{{cartTotal}}</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span class="free">FREE</span>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span>₹{{cartTotal}}</span>
                </div>
                <button class="checkout-btn">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <div class="empty-state" *ngIf="cartItems.length === 0">
        <div class="empty-icon">🛒</div>
        <h2>Your cart is empty</h2>
        <p>Discover our curated Ayurvedic products</p>
        <a routerLink="/shop" class="cta-btn">Browse Products</a>
    </div>

</div>
