<nav class="navbar" [class.scrolled]="isScrolled">
    <div class="nav-container">

        <!-- MOBILE MENU BUTTON -->
        <div class="mobile-menu-btn" (click)="openMenu()">
            <app-icon name="menu" [size]="28" class="icon-3d nav-icon"></app-icon>
        </div>

        <!-- BRAND -->
        <div class="nav-left">
            <img src="assets/logo/ayurus_logo_2.png" alt="Ayurustic" class="brand-logo" routerLink="/">
        </div>

        <!-- DESKTOP LINKS -->
        <div class="nav-middle" *ngIf="isDesktop">
            <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                <app-icon name="home" [size]="18" class="nav-menu-icon"></app-icon> HOME
            </a>
            <a class="nav-link" routerLink="/shop" routerLinkActive="active">
                <app-icon name="shop" [size]="18" class="nav-menu-icon"></app-icon> SHOP
            </a>
            <a class="nav-link" routerLink="/discover" routerLinkActive="active">
                <app-icon name="discover" [size]="18" class="nav-menu-icon"></app-icon> DISCOVER
            </a>
            <a class="nav-link" routerLink="/wishlist" routerLinkActive="active">
                <app-icon name="wishlist" [size]="18" class="nav-menu-icon"></app-icon> WISHLIST
            </a>
            <a class="nav-link" routerLink="/account" routerLinkActive="active">
                <app-icon name="user" [size]="18" class="nav-menu-icon"></app-icon> ACCOUNT
            </a>
            <a class="nav-link" routerLink="/about" routerLinkActive="active">
                <app-icon name="about" [size]="18" class="nav-menu-icon"></app-icon> ABOUT US
            </a>
        </div>

        <!-- CART -->
        <a routerLink="/cart">
            <div class="nav-right">
                <div class="icon-circle cart-icon">

                    <app-icon name="cart" [size]="26" class="icon-3d nav-icon"></app-icon>

                </div>
            </div>
        </a>
    </div>
</nav>

<!-- MOBILE SLIDE MENU -->
<div class="mobile-overlay" [class.active]="isMenuOpen" (click)="isMenuOpen=false"></div>

<aside class="mobile-drawer" [class.open]="isMenuOpen">
    <div class="drawer-header">
        <span class="close-btn" (click)="isMenuOpen=false">&times;</span>
        <input type="text" placeholder="Search products..." />
    </div>

    <div class="drawer-links">
        <a routerLink="/" (click)="closeMenu()">
            <app-icon name="home" [size]="20" class="drawer-icon"></app-icon> HOME
        </a>
        <a routerLink="/shop" (click)="closeMenu()">
            <app-icon name="shop" [size]="20" class="drawer-icon"></app-icon> SHOP
        </a>
        <a routerLink="/discover" (click)="closeMenu()">
            <app-icon name="discover" [size]="20" class="drawer-icon"></app-icon> DISCOVER
        </a>
        <a routerLink="/wishlist" (click)="closeMenu()">
            <app-icon name="wishlist" [size]="20" class="drawer-icon"></app-icon> WISHLIST
        </a>
        <a routerLink="/account" (click)="closeMenu()">
            <app-icon name="user" [size]="20" class="drawer-icon"></app-icon> ACCOUNT
        </a>
        <a routerLink="/about" (click)="closeMenu()">
            <app-icon name="about" [size]="20" class="drawer-icon"></app-icon> ABOUT US
        </a>
    </div>
</aside>

<!-- Bottom Navbar (Mobile Only) -->
<nav class="mobile-bottom-nav">
    <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <app-icon name="home" [size]="24" class="nav-icon"></app-icon>
        <span>Home</span>
    </a>
    <a class="nav-item" routerLink="/shop" routerLinkActive="active">
        <app-icon name="shop" [size]="24" class="nav-icon"></app-icon>
        <span>Shop</span>
    </a>
    <a class="nav-item" routerLink="/wishlist" routerLinkActive="active">
        <app-icon name="wishlist" [size]="24" class="nav-icon"></app-icon>
        <span>Wishlist</span>
    </a>
    <a class="nav-item cart" routerLink="/discover" routerLinkActive="active">
        <app-icon name="cart" [size]="24" class="nav-icon"></app-icon>
        <span>Discover</span>
    </a>
    <a class="nav-item" routerLink="/account" routerLinkActive="active">
        <app-icon name="user" [size]="24" class="nav-icon"></app-icon>
        <span>Account</span>
    </a>
</nav>
